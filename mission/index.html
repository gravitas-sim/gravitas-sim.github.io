<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mission design diagnostics | Gravitas</title>
    <meta
      name="description"
      content="The Gravitas mission-design core, run in a Worker: impulsive transfers, plane changes, rendezvous, Lambert's problem, patched conics, flybys and transfer windows, each against its reference cases. An educational model, not operational mission design."
    />
    <meta name="theme-color" content="#07080f" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/page.css" />
    <style>
      /* Local to this page: forms, tables and one plot. */
      .mn-wrap {
        max-width: 64rem;
        margin: 0 auto;
        padding: 2rem 1rem 4rem;
      }
      .mn-wrap a {
        color: var(--accent);
        text-underline-offset: 3px;
      }
      .mn-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        align-items: end;
        margin: 0.75rem 0;
      }
      /* A field's width comes from the bar, not from its control: WebKit
         sizes a select to its longest option (R6's title is long), and an
         automatic grid track grows to fit it. */
      .mn-field {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 0.25rem;
        min-width: 0;
        flex: 1 1 12rem;
        max-width: 100%;
      }
      /* WebKit lays a select's menu out wider than the select and counts
         it as overflow; clip it inside the select (its focus ring is
         outside, and stays). */
      .mn-field select {
        overflow: hidden;
      }
      .mn-field select,
      .mn-field input {
        width: 100%;
        box-sizing: border-box;
        min-width: 0;
        max-width: 100%;
        font: inherit;
        color: inherit;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        padding: 0.35rem 0.45rem;
      }
      .mn-wrap section {
        margin: 1.5rem 0;
      }
      .mn-wrap h2 {
        font-size: 1.15rem;
      }
      .mn-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
        margin: 0.5rem 0;
      }
      .mn-table caption {
        text-align: left;
        color: #b7bfcf;
        padding-bottom: 0.25rem;
      }
      .mn-table th,
      .mn-table td {
        text-align: left;
        vertical-align: top;
        padding: 0.3rem 0.4rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        overflow-wrap: anywhere;
      }
      .mn-scroll {
        overflow-x: auto;
      }
      .mn-plots {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 16rem), 1fr));
      }
      .mn-plots figure {
        margin: 0;
      }
      .mn-plot {
        width: 100%;
        height: auto;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
      }
      .mn-plots figcaption {
        font-size: 0.85rem;
        color: #b7bfcf;
      }
      .mn-note {
        border-left: 3px solid var(--accent);
        padding: 0.25rem 0.75rem;
        color: #d7dce6;
      }
      .mn-window {
        display: grid;
        gap: 0.5rem;
        grid-template-columns: minmax(0, 1fr);
        max-width: 40rem;
      }
      .mn-window canvas {
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: #0b0d17;
      }
      .mn-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 1rem;
        font-size: 0.85rem;
        color: #b7bfcf;
      }
      .mn-swatch {
        display: inline-block;
        width: 0.9rem;
        height: 0.9rem;
        vertical-align: -0.1rem;
        margin-right: 0.3rem;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .mn-refused {
        background: #3a3f52;
      }
      progress {
        width: 12rem;
        max-width: 100%;
      }
    </style>
  </head>
