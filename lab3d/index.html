<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3-D dynamics diagnostics | Gravitas</title>
    <meta
      name="description"
      content="The Gravitas 3-D small-N kernel, run in a Worker: its reference problems against the validation's tolerances, any system file, and how fast it runs on this device."
    />
    <meta name="theme-color" content="#07080f" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/page.css" />
    <style>
      /* Local to this page: a form, tables and plain plots. */
      .lb-wrap {
        max-width: 64rem;
        margin: 0 auto;
        padding: 2rem 1rem 4rem;
      }
      .lb-wrap a {
        color: var(--accent);
        text-underline-offset: 3px;
      }
      .lb-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        align-items: end;
        margin: 0.75rem 0;
      }
      /* A field's width comes from the bar, not from its control: WebKit
         sizes a select to its longest option (R6's title is long), and an
         automatic grid track grows to fit it. */
      .lb-field {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 0.25rem;
        min-width: 0;
        flex: 1 1 12rem;
        max-width: 100%;
      }
      /* WebKit lays a select's menu out wider than the select and counts
         it as overflow; clip it inside the select (its focus ring is
         outside, and stays). */
      .lb-field select {
        overflow: hidden;
      }
      .lb-field select,
      .lb-field input {
        width: 100%;
        box-sizing: border-box;
        min-width: 0;
        max-width: 100%;
        font: inherit;
        color: inherit;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        padding: 0.35rem 0.45rem;
      }
      .lb-wrap section {
        margin: 1.5rem 0;
      }
      .lb-wrap h2 {
        font-size: 1.15rem;
      }
      .lb-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
        margin: 0.5rem 0;
      }
      .lb-table caption {
        text-align: left;
        color: #b7bfcf;
        padding-bottom: 0.25rem;
      }
      .lb-table th,
      .lb-table td {
        text-align: left;
        vertical-align: top;
        padding: 0.3rem 0.4rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        overflow-wrap: anywhere;
      }
      .lb-scroll {
        overflow-x: auto;
      }
      .lb-plots {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 16rem), 1fr));
      }
      .lb-plots figure {
        margin: 0;
      }
      .lb-plot {
        width: 100%;
        height: auto;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
      }
      .lb-plots figcaption {
        font-size: 0.85rem;
        color: #b7bfcf;
      }
      progress {
        width: 12rem;
        max-width: 100%;
      }
    </style>
  </head>
  <body class="doc-page">
    <main class="lb-wrap" aria-labelledby="lb-title">
      <div id="langSwitch" class="lb-bar" role="group" aria-label="Language" data-i18n-aria-label="lab3d.lang"></div>
      <h1 id="lb-title" data-i18n="lab3d.title">3-D dynamics diagnostics</h1>
      <p data-i18n="lab3d.intro"></p>
      <p>
        <a href="/" data-i18n="lab3d.back">Back to Gravitas</a> ·
        <a href="https://github.com/gravitas-sim/gravitas-sim.github.io/blob/v2/LAB3D.md" data-i18n="lab3d.docs">How the kernel works (LAB3D.md)</a>
      </p>

      <section aria-labelledby="lb-run-h">
        <h2 id="lb-run-h" data-i18n="lab3d.run.heading">Run</h2>
        <div class="lb-bar">
          <div class="lb-field">
            <label for="lb-problem" data-i18n="lab3d.problem">Problem</label>
            <select id="lb-problem"></select>
          </div>
          <div class="lb-field" id="lb-file-row" hidden>
            <label for="lb-file" data-i18n="lab3d.file">System file</label>
            <input id="lb-file" type="file" accept="application/json,.json" />
          </div>
          <div class="lb-field">
            <label for="lb-scheme" data-i18n="lab3d.scheme">Integrator</label>
            <select id="lb-scheme"></select>
          </div>
          <div class="lb-field">
            <label for="lb-step" data-i18n="lab3d.step">Step, or tolerance for Dormand-Prince</label>
            <input id="lb-step" type="text" inputmode="decimal" value="0.001" />
          </div>
          <div class="lb-field" id="lb-span-row" hidden>
            <label for="lb-span" data-i18n="lab3d.span">Span (time units)</label>
            <input id="lb-span" type="text" inputmode="decimal" value="100" />
            <label for="lb-samples" data-i18n="lab3d.samples">Samples</label>
            <input id="lb-samples" type="text" inputmode="numeric" value="500" />
          </div>
          <button id="lb-go" type="button" class="ui-button is-primary" data-i18n="lab3d.go">Run</button>
          <button id="lb-cancel" type="button" class="ui-button" data-i18n="lab3d.cancel" disabled>Cancel</button>
          <progress id="lb-progress" max="1" value="0" aria-labelledby="lb-status"></progress>
        </div>
        <p id="lb-status" role="status" aria-live="polite"></p>
      </section>

      <section aria-labelledby="lb-results-h">
        <h2 id="lb-results-h" data-i18n="lab3d.results.heading">Results</h2>
        <div id="lb-results" class="lb-scroll"></div>
        <h3 data-i18n="lab3d.checks.heading">Against the reference</h3>
        <div id="lb-checks" class="lb-scroll"></div>
        <h3 data-i18n="lab3d.warnings.heading">Warnings</h3>
        <ul id="lb-warnings"></ul>
        <h3 data-i18n="lab3d.events.heading">Events</h3>
        <div id="lb-events" class="lb-scroll"></div>
      </section>

      <section aria-labelledby="lb-plots-h">
        <h2 id="lb-plots-h" data-i18n="lab3d.plots.heading">Plots</h2>
        <div id="lb-plots" class="lb-plots"></div>
      </section>

      <section aria-labelledby="lb-bench-h">
        <h2 id="lb-bench-h" data-i18n="lab3d.bench.heading">How fast it runs here</h2>
        <p data-i18n="lab3d.bench.hint"></p>
        <button id="lb-bench-go" type="button" class="ui-button" data-i18n="lab3d.bench.go">Measure</button>
        <div id="lb-bench" class="lb-scroll"></div>
      </section>
    </main>
    <script type="module" src="/js/lab3dPage.js"></script>
  </body>
</html>
