# The Playwright browsers, cached and installed. Every browser job needs the
# same four steps, and they were written out four times: the version the
# browsers are keyed on, the cache, the install on a miss, and the system
# libraries (the cache does not hold those; they normally take about a minute).
#
# The system libraries are the step that hangs. `playwright install-deps` is
# apt-get as root, and on some runners it stalls with no output until the
# job's timeout - 30 minutes of a shard spent on nothing, after which the
# coverage job fails for the missing shard (2026-09-30, and three runs on
# 2026-10-07). So each attempt gets a bounded time, a hung apt or dpkg is
# killed and its half-done state repaired, and it is tried three times before
# the job gives up. Carl approved the change on 2026-10-07.
#
# 2026-10-22: with five minutes an attempt, a runner whose Azure mirror
# (azure.archive.ubuntu.com) ignores every request lost two attempts (ten
# minutes) before the third got through, and the shard then ran out of its own
# timeout and was cancelled (PRs #416 and #419, shards 6/12 and the
# accessibility job). The libraries normally take about a minute, so an attempt
# now gets three minutes, and after a failed attempt the remaining ones use
# archive.ubuntu.com instead of the Azure mirror. Carl approved the change in
# chat on 2026-10-22.
name: Playwright browsers
description: Restore or install one Playwright browser, keyed on the pinned version
inputs:
  browser:
    description: chromium, firefox or webkit
    default: chromium
runs:
  using: composite
  steps:
    - name: Resolve the Playwright version
      id: pw
      shell: bash
      run: |
        version=$(node -p "require('./package.json').devDependencies['@playwright/test']")
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache browsers
      uses: actions/cache@v6
      id: browsers
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ inputs.browser }}

    - name: Install the browser
      if: steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install ${{ inputs.browser }}

    # A mirror that answers nothing ("Ign" on every request from
    # azure.archive.ubuntu.com, twice on 2026-10-09) holds apt for its default
    # two-minute connect timeout per request, so a single attempt below spends
    # its five minutes waiting. Thirty seconds and three retries per request
    # let apt fail on its own inside an attempt, and the next attempt starts
    # fresh. Carl approved the change on 2026-10-09.
    - name: Bound apt's network waits
      shell: bash
      run: |
        printf '%s\n' \
          'Acquire::http::Timeout "30";' \
          'Acquire::https::Timeout "30";' \
          'Acquire::Retries "3";' \
          | sudo tee /etc/apt/apt.conf.d/80-gravitas-network > /dev/null

    - name: Install browser dependencies
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
      run: |
        for attempt in 1 2 3; do
          if timeout --kill-after=30 180 npx playwright install-deps "$BROWSER"; then
            exit 0
          fi
          echo "::warning::install-deps attempt $attempt failed or ran past three minutes"
          # By exact process name, and by the locks themselves: a `pkill -f`
          # pattern also matches the `sudo pkill` running it, which killed
          # itself and left the hung apt-get holding the lock (2026-10-07).
          sudo pkill -9 -x apt-get || true
          sudo pkill -9 -x apt || true
          sudo pkill -9 -x dpkg || true
          sudo fuser -k -9 /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock \
            /var/lib/apt/lists/lock /var/cache/apt/archives/lock || true
          sudo dpkg --configure -a || true
          # The Azure mirror is the one that stalls; the next attempt asks the
          # main archive instead. The ubuntu-24.04 runner image does not name
          # the mirror in its sources: they say mirror+file:/etc/apt/apt-mirrors.txt
          # (the failing logs show `Get:1 file:/etc/apt/apt-mirrors.txt Mirrorlist`)
          # and the Azure URL lives in that list, so the list is rewritten as
          # well as the one-line and deb822 sources. A runner without the Azure
          # name is left alone (the substitution then matches nothing).
          # `playwright install-deps` runs its own apt-get update at the start
          # of the next attempt, which reads the new mirror. The two echoes
          # let the log show which mirror the next attempt will use.
          sudo sed -i -E 's#(https?://)azure\.archive\.ubuntu\.com/#\1archive.ubuntu.com/#g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          echo "apt mirror list after attempt $attempt:"
          cat /etc/apt/apt-mirrors.txt 2>/dev/null || echo "(no /etc/apt/apt-mirrors.txt)"
          grep -rhE '^(URIs|deb) ' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | head -n 4 || true
        done
        echo "::error::install-deps failed three times"
        exit 1
