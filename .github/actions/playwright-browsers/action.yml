# The Playwright browsers, cached and installed. Every browser job needs the
# same four steps, and they were written out four times: the version the
# browsers are keyed on, the cache, the install on a miss, and the system
# libraries on a hit (the cache does not hold those; they take seconds).
name: Playwright browsers
description: Restore or install one Playwright browser, keyed on the pinned version
inputs:
  browser:
    description: chromium, firefox or webkit
    default: chromium
runs:
  using: composite
  steps:
    - name: Resolve the Playwright version
      id: pw
      shell: bash
      run: |
        version=$(node -p "require('./package.json').devDependencies['@playwright/test']")
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache browsers
      uses: actions/cache@v6
      id: browsers
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ inputs.browser }}

    - name: Install the browser
      if: steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps ${{ inputs.browser }}

    - name: Install browser dependencies
      if: steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps ${{ inputs.browser }}
