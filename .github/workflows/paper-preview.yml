name: Build paper preview

on:
  push:
    branches:
      - paper-showcase-rewrite-2026-09-14
    paths:
      - "paper/**"
      - ".github/workflows/paper-preview.yml"

permissions:
  contents: write

jobs:
  build-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out draft branch
        uses: actions/checkout@v4

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-publishers

      - name: Compile manuscript
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error gravitas-showcase.tex
          bibtex gravitas-showcase
          pdflatex -interaction=nonstopmode -halt-on-error gravitas-showcase.tex
          pdflatex -interaction=nonstopmode -halt-on-error gravitas-showcase.tex

      - name: Preserve compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravitas-paper-build
          path: |
            paper/gravitas-showcase.pdf
            paper/gravitas-showcase.log
          if-no-files-found: warn

      - name: Commit compiled PDF
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper/gravitas-showcase.pdf
          if git diff --cached --quiet; then
            echo "Compiled PDF is unchanged."
            exit 0
          fi
          git commit -m "Compile Gravitas manuscript preview"
          git push
