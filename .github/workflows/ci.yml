# =============================================================================
# Continuous integration
# -----------------------------------------------------------------------------
# What this is for: a future change should not be able to silently break the
# sandbox, the observing tools, the guided lessons, the mobile layout or the
# production build. Every job here exists because one of those can break in a way
# that reading the diff will not reveal.
#
# The shape, and why
# -----------------------------------------------------------------------------
#   checks       Everything that needs no browser: lint, formatting, the jest
#                suite, the physics validation table, the link checker, the
#                thumbnail manifest, and the documentation-drift check. Under
#                two minutes, and it is the job that catches most mistakes, so
#                it runs first and independently.
#
#   build        Produces dist/ and uploads it. Runs in parallel with checks
#                rather than after it: a broken build and a lint error are
#                independent facts and a contributor should learn both at once.
#
#   e2e          The browser smoke suite against the unbundled sources, where it
#                can see inside the application. Chromium plus a phone profile.
#
#   e2e-build    The same browser, against the artifact `build` produced. A
#                narrower, DOM-only spec that defends what the source suite
#                structurally cannot reach: chunk splitting, deferred imports,
#                assets the build forgot to copy.
#
#   cross-browser  Firefox and WebKit, running the @cross-browser profile and
#                  not the full suite. Not on pull requests: they roughly triple
#                  the wall clock and what they find in a canvas application is
#                  overwhelmingly engine timing rather than a product
#                  regression. They run on pushes to main and once a week.
#
#                  What this job is and is not
#                  ---------------------------
#                  It answers one question: does Gravitas work in this engine.
#                  It does not re-check numerical results. A chaos divergence
#                  measurement or a resonance libration amplitude is arithmetic
#                  over doubles; it comes out the same in every engine, and
#                  running it three times buys nothing but wall clock. Those
#                  live in the Chromium job, which runs the whole suite.
#
#                  This was not always so. The job used to run all 177 tests
#                  serially in WebKit and hit the thirty-minute ceiling, and
#                  the two things that pushed it over were both the wrong tests
#                  to be running here:
#
#                    The video-capture tests waited for #recordBtn, which
#                    Gravitas hides when capture.canRecord() is false. WebKit
#                    has no usable MediaRecorder + captureStream + codec
#                    combination, so hiding it is correct and the test was
#                    asserting a promise the application does not make. The
#                    tests that actually encode now skip on the detected
#                    capability and will run themselves the day WebKit gains
#                    it; a fast contract test checks the button matches
#                    canRecord() in every engine.
#
#                    The long chaos tests wait for 3,200 simulated seconds of
#                    recorded evolution. The bench advances a fixed step per
#                    animation frame, so that span is a function of frame
#                    throughput, and WebKit on a two-core runner cannot reach
#                    it inside the wait - then spends another five minutes
#                    retrying. The profile carries a short chaos test that
#                    proves the bench records and samples; the scientific
#                    result stays in Chromium and in the pure-analysis jest
#                    tests.
#
#                  If this profile ever outgrows the budget again, shard it
#                  across jobs with one worker each. Do not raise the ceiling
#                  and do not add workers.
#
# On the instructor materials
# -----------------------------------------------------------------------------
# `npm run build` encrypts the instructor guides with a passphrase that is not in
# the repository, and a pull request from a fork cannot read repository secrets.
# So CI uses `npm run build:ci`, which builds every document and answer key for
# real - that is where breakage actually happens - and encrypts them with a
# random throwaway secret. The output is deliberately undecryptable and is never
# published; the artifact exists only so the browser job has something to load.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday morning, UTC. Catches an engine or dependency change that landed
    # while nobody was pushing.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# A second push to the same branch makes the first one irrelevant. Never cancel
# a run on main, though: those are the ones whose result gets referenced later.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  # The suite is noisy about colour codes in a log that has none.
  NO_COLOR: '1'

jobs:
  checks:
    name: Lint, tests and physics validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Caches the npm download cache, keyed on package-lock.json.
          cache: npm

      - run: npm ci

      # Ordered cheapest-first so a formatting mistake does not wait behind a
      # two-minute test run to be reported.
      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Physics validation
        run: npm run validate:physics

      - name: Internal links and anchors
        run: npm run validate:links

      - name: Scenario thumbnail manifest
        run: npm run thumbnails:check

      # A stale precache manifest is the worst kind of stale: the cache name
      # never changes, so a returning browser keeps serving last week's
      # JavaScript out of its own cache and nothing anywhere reports an error.
      - name: Service worker manifest is current
        run: npm run sw:check

      # Import cycles and layer violations. The graph had eleven cycles before
      # the state was pulled out of ui.js and every one of them ran through a
      # coordinator, which meant the renderer's dependencies included the
      # settings panel. This job is what stops that coming back: it fails on any
      # new cycle, on a low-level module importing a coordinator, and - so the
      # baseline can only shrink - on an exemption that no longer applies.
      - name: Module architecture
        run: npm run check:architecture

      # Every investigation and every step, against the widget registry, the
      # scenario catalog, the grader, the translations, the instructor guide and
      # the manifests. A lesson is data spread over six files and a broken
      # reference between them is invisible until a class hits it.
      - name: Investigations validate
        run: npm run author:check

      # vendor/ carries three.js, Chart.js and the nine self-hosted font faces,
      # generated from the pinned packages and committed because GitHub Pages
      # serves the repository root. This fails if a lockfile bump moved one of
      # them without `npm run vendor` being run - which would mean the site
      # keeps serving the old copy while package.json claims the new one.
      - name: Vendored libraries and fonts are current
        run: npm run vendor:check

      # CITATION.cff and .zenodo.json are generated from one source and must
      # stay valid and mutually consistent. Zenodo prefers .zenodo.json when
      # both are present, so a disagreement is not cosmetic: it decides what a
      # DOI records.
      - name: Citation metadata
        run: node tools/validate-citation.mjs

      # No advisories, and none in the production dependency tree in
      # particular. Not `audit fix`: this reports, and a fix is a reviewed
      # change like any other.
      - name: Dependency audit
        run: |
          npm audit --audit-level=moderate
          npm audit --omit=dev

      # Every count the documentation cites is generated from the catalog, the
      # lesson manifest or the test output. This is the job that notices when
      # one of them has drifted - a README that says 43 scenarios over a catalog
      # of 48 is the kind of error a reader catches and an author never does.
      - name: Documentation counts and links
        run: npm run docs:check

      # And the shipped PDF, which carries the same counts in its metadata.
      - name: User manual matches the application
        run: npm run manual:check

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # build:ci differs from build in one respect: it does not need the real
      # instructor passphrase. See the header.
      - name: Build
        run: npm run build:ci

      # What a first-time visitor waits for, against a written ceiling. Growth
      # is allowed; unexplained growth is not - raising a limit means editing
      # tools/bundle-budget.mjs and saying why in the same commit.
      - name: Bundle budget
        run: npm run budget

      - name: Check the built site's internal links
        run: node tools/check-links.mjs --root dist

      - name: Report what a visitor downloads
        run: |
          echo "### Built bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist >> "$GITHUB_STEP_SUMMARY"
          find dist/js -name '*.js' -not -name '*.map' -printf '%10s  %p\n' \
            | sort -rn | head -12 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          # Source maps are large and no job downstream reads them.
          if-no-files-found: error

  e2e:
    name: Browser smoke tests (sources)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Playwright's browsers are ~400MB and unpack slowly, so they are cached
      # separately from npm and keyed on the pinned version: a browser build and
      # the client that drives it have to match.
      - name: Resolve the Playwright version
        id: pw
        run: |
          version=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The system libraries the browser links against are not in the cache, so
      # they are installed even on a hit. This is a few seconds.
      - name: Install browser dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run the suite
        run: npm run e2e

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-sources
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  accessibility:
    name: Accessibility (axe + keyboard)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Its own job rather than a line inside the browser suite. An accessibility
    # regression should be legible as one on the pull request rather than as
    # "e2e failed", and this runs in parallel so it costs no wall-clock. The
    # same specs also run inside `npm run e2e`; that is the safety net if this
    # job is ever removed.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Playwright's browsers are ~400MB and unpack slowly, so they are cached
      # separately from npm and keyed on the pinned version: a browser build and
      # the client that drives it have to match.
      - name: Resolve the Playwright version
        id: pw
        run: |
          version=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The system libraries the browser links against are not in the cache, so
      # they are installed even on a hit. This is a few seconds.
      - name: Install browser dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: axe-core over every surface, both languages, both themes
        run: npm run a11y:axe

      # Focus order, focus traps, Escape, focus restoration, heading order,
      # landmarks, reflow at 200% and 400%, reduced motion, and the textual
      # description of the canvas. The half axe cannot see.
      - name: Keyboard, focus and the canvas description
        run: npm run a11y:manual

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-accessibility
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  e2e-build:
    name: Browser smoke tests (production build)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # The artifact rather than a second build: this job tests exactly the bytes
      # the build job produced, which is the point of separating them.
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Resolve the Playwright version
        id: pw
        run: |
          version=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install browser dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run the production spec
        run: npm run e2e:dist

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-build
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  cross-browser:
    name: Engine compatibility (${{ matrix.browser }})
    # Not on pull requests. See the header for why.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Thirty minutes is the budget, and the profile is sized to fit inside it
    # rather than the budget being raised to fit the profile. See the header.
    timeout-minutes: 30
    strategy:
      # One engine failing should not hide the other's result.
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Resolve the Playwright version
        id: pw
        run: |
          version=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: >-
            playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{
            matrix.browser }}

      - name: Install ${{ matrix.browser }}
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install browser dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      # The @cross-browser profile, not the full suite. One worker for both
      # engines: a GitHub runner has two cores, and a second WebKit worker
      # starves the application's own start-up sequence rather than speeding
      # anything up. Firefox is single-worker too, so the two jobs are
      # comparable and neither depends on how the runner happens to be loaded.
      - name: Run the engine-compatibility profile
        env:
          GRAVITAS_E2E_BROWSERS: ${{ matrix.browser }}
        run: npm run e2e:cross-browser -- --workers=1

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  # A single job to require in branch protection, so the rule does not have to be
  # edited every time a job is added or a matrix entry changes. It fails if any
  # job it needs failed, and tolerates cross-browser being skipped on a pull
  # request.
  ci:
    name: CI
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [checks, build, e2e, accessibility, e2e-build, cross-browser]
    steps:
      - name: Report
        run: |
          echo "checks:        ${{ needs.checks.result }}"
          echo "build:         ${{ needs.build.result }}"
          echo "e2e:           ${{ needs.e2e.result }}"
          echo "accessibility: ${{ needs.accessibility.result }}"
          echo "e2e-build:     ${{ needs.e2e-build.result }}"
          echo "cross-browser: ${{ needs.cross-browser.result }}"
          failed=0
          for result in \
            "${{ needs.checks.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.e2e.result }}" \
            "${{ needs.accessibility.result }}" \
            "${{ needs.e2e-build.result }}" \
            "${{ needs.cross-browser.result }}"
          do
            case "$result" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::At least one CI job did not pass."
            exit 1
          fi
          echo "All required jobs passed."
