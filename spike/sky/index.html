<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Lab spike</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#4a4a4a; --sky:#0d1b3a; --ink:#f5f7ff; --line:#7f90b8; --accent:#0b5cad; --sun:#ffd23f; --moon:#e8e8e8; --planet:#7fd1ff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161f; --fg:#eef1f8; --muted:#b9c2d6; --accent:#7db8ff; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; }
  h1 { font-size:1.4rem; margin:0 0 12px; } h2 { font-size:1.1rem; margin:20px 0 8px; }
  form, .row { display:flex; flex-wrap:wrap; gap:12px; align-items:end; }
  label { display:flex; flex-direction:column; font-size:.9rem; color:var(--muted); gap:2px; }
  input, button { font:inherit; min-height:32px; min-width:32px; padding:2px 8px; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:4px; }
  button { cursor:pointer; } button:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  svg { width:100%; height:auto; display:block; background:var(--sky); border-radius:6px; }
  #horizon { max-width:640px; margin:0 auto; }
  .dome { fill:var(--sky); stroke:var(--line); stroke-width:2; } .ring { stroke:#4b5d8a; stroke-width:1; fill:none; stroke-dasharray:6 6; }
  .horizonline { stroke:#ffb35c; fill:none; stroke-width:2; }
  .cardinal { fill:var(--ink); font-weight:600; font-family:system-ui; font-size:calc(16px * var(--px, 1)); } .lab { fill:var(--ink); font-family:system-ui; font-size:calc(12px * var(--px, 1)); }
  .obj.star, .obj.star circle { fill:var(--ink); } .obj.sun, .obj.sun circle { fill:var(--sun); } .obj.moon, .obj.moon circle { fill:var(--moon); } .obj.planet, .obj.planet circle { fill:var(--planet); } .below { opacity:.3; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; } caption { text-align:left; font-weight:600; padding:4px 0; }
  th, td { padding:4px 8px; border-bottom:1px solid var(--line); text-align:left; } td.num { text-align:right; }
  th[scope=col] button { border:0; background:transparent; font-weight:600; width:100%; text-align:left; }
  .tablewrap { max-height:420px; overflow:auto; }
</style>
</head>
<body>
<main>
  <h1 id="h1">Sky Lab spike</h1>
  <p id="status" role="status"></p>
  <form onsubmit="return false">
    <label><span id="l-date">Date (UTC)</span><input id="date" type="date"></label>
    <label><span id="l-time">Time (UTC)</span><input id="time" type="time"></label>
    <label><span id="l-lat">Latitude</span><input id="lat" type="number" step="0.01" min="-90" max="90"></label>
    <label><span id="l-lon">Longitude</span><input id="lon" type="number" step="0.01" min="-180" max="180"></label>
  </form>
  <div class="row" style="margin-top:8px">
    <button type="button" id="b-1d-">Back 1 day</button><button type="button" id="b-1h-">Back 1 hour</button>
    <button type="button" id="b-1h">Forward 1 hour</button><button type="button" id="b-1d">Forward 1 day</button>
    <button type="button" id="play" aria-pressed="false">Play</button>
  </div>
  <h2 id="h-horizon">Horizon view</h2>
  <svg id="horizon" viewBox="0 0 1000 1000" role="img" aria-label="Horizon view"></svg>
  <h2 id="h-eq">Equatorial map</h2>
  <svg id="eq" viewBox="0 0 1000 500" role="img" aria-label="Equatorial map of the same sky; the table lists every object"></svg>
  <p id="count" role="status" aria-live="polite"></p>
  <div class="tablewrap" tabindex="0" role="region" aria-labelledby="cap">
    <table><caption id="cap">Objects above the horizon</caption><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table>
  </div>
</main>
<script type="module">import { init } from './render.js'; init(new URLSearchParams(location.search).get('stars') || './stars.json', Number(new URLSearchParams(location.search).get('n') || 1000));</script>
</body>
</html>
