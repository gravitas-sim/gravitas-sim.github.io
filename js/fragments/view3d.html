<!-- ⚙️ Spacetime viewport -->
<div
  id="threeViewportContainer"
  class="three-view-container"
  role="region"
  aria-labelledby="threeViewTitle"
  style="display: none"
>
  <!-- This carried aria-hidden="true", which hid a panel containing two
       real buttons. They stayed in the tab order, so a keyboard reader
       could focus the close button and be told nothing about it at all.
       The panel is hidden from everyone by display:none when it is shut,
       which is the correct mechanism and the only one needed. -->
  <div class="three-view-toolbar">
    <div class="three-view-meta">
      <span class="three-view-title" id="threeViewTitle">Spacetime View</span>
      <span id="threeViewStatus" class="three-view-status">Hidden</span>
    </div>
    <div class="three-toolbar-actions">
      <button
        id="reset3DCameraBtn"
        class="three-toolbar-btn"
        title="Reframe around active system"
      >
        Reset
      </button>
      <button
        id="close3DViewBtn"
        class="three-toolbar-btn"
        title="Hide the spacetime viewport"
        aria-label="Close the spacetime view"
        data-i18n-aria-label="view3d.close.label"
      >
        <span aria-hidden="true">✕</span>
      </button>
    </div>
  </div>
  <div id="threeViewport" class="three-view-stage"></div>
  <div class="three-view-hint">
    Drag to orbit • Scroll to zoom • Right-click or two-finger drag to pan
  </div>
  <!-- The camera without a drag, a wheel or a second finger (Prompt 278):
       data-cam is "turn" or "move" with steps across and up, or "zoom" with a
       factor. -->
  <div
    id="threeViewPad"
    class="three-view-hint"
    role="group"
    aria-labelledby="threeViewPadName"
  >
    <span id="threeViewPadName" class="visually-hidden"
      ><span class="gs-en">Turn, move and zoom the spacetime view</span
      ><span class="gs-es" lang="es"
        >Girar, mover y ampliar la vista del espaciotiempo</span
      ></span
    >
    <button type="button" class="three-toolbar-btn" data-cam="turn,-1,0">
      <span aria-hidden="true">&#x21B6;</span
      ><span class="visually-hidden gs-en">Turn left</span
      ><span class="visually-hidden gs-es" lang="es">Girar a la izquierda</span>
    </button>
    <button type="button" class="three-toolbar-btn" data-cam="turn,1,0">
      <span aria-hidden="true">&#x21B7;</span
      ><span class="visually-hidden gs-en">Turn right</span
      ><span class="visually-hidden gs-es" lang="es">Girar a la derecha</span>
    </button>
    <button type="button" class="three-toolbar-btn" data-cam="turn,0,1">
      <span aria-hidden="true">&#x2912;</span
      ><span class="visually-hidden gs-en">Tilt up</span
      ><span class="visually-hidden gs-es" lang="es">Inclinar hacia arriba</span>
    </button>
    <button type="button" class="three-toolbar-btn" data-cam="turn,0,-1">
      <span aria-hidden="true">&#x2913;</span
      ><span class="visually-hidden gs-en">Tilt down</span
      ><span class="visually-hidden gs-es" lang="es">Inclinar hacia abajo</span>
    </button>
    <button type="button" class="three-toolbar-btn" data-cam="move,-1,0">
      <span aria-hidden="true">&larr;</span
      ><span class="visually-hidden gs-en">Move left</span
      ><span class="visually-hidden gs-es" lang="es">Mover a la izquierda</span>
    </button>
    <button type="button" class="three-toolbar-btn" data-cam="move,1,0">
      <span aria-hidden="true">&rarr;</span
      ><span class="visually-hidden gs-en">Move right</span
      ><span class="visually-hidden gs-es" lang="es">Mover a la derecha</span>
    </button>
    <button type="button" class="three-toolbar-btn" data-cam="move,0,1">
      <span aria-hidden="true">&uarr;</span
      ><span class="visually-hidden gs-en">Move up</span
      ><span class="visually-hidden gs-es" lang="es">Mover hacia arriba</span>
    </button>
    <button type="button" class="three-toolbar-btn" data-cam="move,0,-1">
      <span aria-hidden="true">&darr;</span
      ><span class="visually-hidden gs-en">Move down</span
      ><span class="visually-hidden gs-es" lang="es">Mover hacia abajo</span>
    </button>
    <button type="button" class="three-toolbar-btn" data-cam="zoom,0.8">
      <span aria-hidden="true">+</span
      ><span class="visually-hidden gs-en">Zoom in</span
      ><span class="visually-hidden gs-es" lang="es">Acercar</span>
    </button>
    <button type="button" class="three-toolbar-btn" data-cam="zoom,1.25">
      <span aria-hidden="true">&minus;</span
      ><span class="visually-hidden gs-en">Zoom out</span
      ><span class="visually-hidden gs-es" lang="es">Alejar</span>
    </button>
  </div>
  <div id="threeViewResizeHandle" class="three-view-resize-handle"></div>
</div>
