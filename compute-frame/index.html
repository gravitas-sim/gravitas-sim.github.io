<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-pXl3EK7/ICwBPtEN9XbcX59BDt/fHntcL0Big70fUso=' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; connect-src https://cdn.jsdelivr.net; worker-src blob:; base-uri 'none'; form-action 'none'" />
    <title>Gravitas compute frame</title>
  </head>
  <body>
    <p>
      This page runs reviewed notebooks for the Gravitas compute page. It has no
      controls and keeps nothing.
    </p>
    <script>(() => {
  // js/compute/messages.js
  var PROTOCOL = "gravitas-compute";
  var PROTOCOL_VERSION = 1;
  var LIMITS = Object.freeze({
    id: 64,
    input: 2e6,
    params: 4e3,
    cell: 2e4,
    cells: 40,
    output: 4e6,
    figure: 1e6,
    stdout: 64e3,
    message: 2e3,
    probe: 80,
    probes: 12,
    packages: 4
  });
  var PACKAGE_NAMES = Object.freeze([
    "numpy",
    "matplotlib",
    "scipy",
    "astropy"
  ]);
  var PHASES = Object.freeze(["runtime", "packages", "cells"]);
  var ERROR_CODES = Object.freeze([
    "invalid-request",
    "busy",
    "runtime-download",
    "runtime-version",
    "notebook-error",
    "memory",
    "output-too-large",
    "cancelled"
  ]);
  var ID = /^[A-Za-z0-9_.:-]{1,64}$/;
  var HEX64 = /^[0-9a-f]{64}$/;
  var PROBE_KEY = /^[A-Za-z][A-Za-z0-9.]{0,31}$/;
  var NAME = /^[a-z][a-z0-9_-]{0,31}$/;
  var VERSION = /^[0-9A-Za-z.+_-]{1,32}$/;
  var isObj = (v) => {
    if (v === null || typeof v !== "object" || Array.isArray(v)) return false;
    const p = Object.getPrototypeOf(v);
    return p === null || Object.getPrototypeOf(p) === null;
  };
  var str = (max) => (v) => typeof v === "string" && v.length <= max;
  var re = (r, max = 128) => (v) => typeof v === "string" && v.length <= max && r.test(v);
  var int = (min, max) => (v) => Number.isInteger(v) && v >= min && v <= max;
  var num = (min, max) => (v) => typeof v === "number" && Number.isFinite(v) && v >= min && v <= max;
  var oneOf = (list2) => (v) => list2.includes(v);
  var list = (item, max) => (v) => Array.isArray(v) && v.length <= max && v.every(item);
  var packages = list(oneOf(PACKAGE_NAMES), LIMITS.packages);
  var dict = (key, value, max) => (v) => isObj(v) && Object.keys(v).length <= max && Object.entries(v).every(([k, x]) => key.test(k) && value(x));
  var shape = (fields, optional = []) => (v) => isObj(v) && Object.keys(v).every((k) => Object.hasOwn(fields, k)) && Object.entries(fields).every(
    ([k, ok]) => Object.hasOwn(v, k) ? ok(v[k]) : optional.includes(k)
  );
  var marks = shape(
    { runtime: num(0, 1e9), packages: num(0, 1e9), cells: num(0, 1e9) },
    ["runtime", "packages", "cells"]
  );
  var runtime = shape(
    {
      name: re(NAME, 32),
      version: re(VERSION, 32),
      python: re(VERSION, 32),
      lockSha256: re(HEX64, 64),
      packages: dict(NAME, (v) => v === null || re(VERSION, 32)(v), 16)
    },
    []
  );
  var SPEC = Object.freeze({
    // The page's.
    hello: { fields: {}, from: "page" },
    load: { fields: { id: re(ID, 64), packages }, from: "page" },
    run: {
      fields: {
        id: re(ID, 64),
        input: str(LIMITS.input),
        params: str(LIMITS.params),
        cells: list(str(LIMITS.cell), LIMITS.cells),
        packages
      },
      from: "page"
    },
    cancel: { fields: { id: re(ID, 64) }, from: "page" },
    // The frame's.
    ready: {
      fields: {
        build: re(HEX64, 64),
        probes: dict(PROBE_KEY, str(LIMITS.probe), LIMITS.probes)
      },
      from: "frame"
    },
    loaded: {
      fields: {
        id: re(ID, 64),
        runtime,
        marks,
        heapBytes: int(0, 2 ** 32)
      },
      from: "frame"
    },
    progress: {
      fields: { id: re(ID, 64), phase: oneOf(PHASES) },
      from: "frame"
    },
    result: {
      fields: {
        id: re(ID, 64),
        output: str(LIMITS.output),
        stdout: str(LIMITS.stdout),
        heapBytes: int(0, 2 ** 32),
        marks,
        runtime
      },
      from: "frame"
    },
    error: {
      fields: {
        id: (v) => v === null || re(ID, 64)(v),
        code: oneOf(ERROR_CODES),
        message: str(LIMITS.message)
      },
      from: "frame"
    }
  });
  var PAGE_TYPES = Object.freeze(
    Object.keys(SPEC).filter((t) => SPEC[t].from === "page")
  );
  var FRAME_TYPES = Object.freeze(
    Object.keys(SPEC).filter((t) => SPEC[t].from === "frame")
  );
  var message = (type, fields = {}) => ({
    protocol: PROTOCOL,
    version: PROTOCOL_VERSION,
    type,
    ...fields
  });
  function readMessage(data, from) {
    const id = isObj(data) && re(ID, 64)(data.id) ? data.id : null;
    if (!isObj(data)) return { ok: false, code: "bad-message", id };
    if (data.protocol !== PROTOCOL) return { ok: false, code: "bad-message", id };
    if (data.version !== PROTOCOL_VERSION)
      return { ok: false, code: "unsupported-version", id };
    const spec = typeof data.type === "string" && Object.hasOwn(SPEC, data.type) ? SPEC[data.type] : null;
    if (!spec || spec.from !== from)
      return { ok: false, code: "unknown-type", id };
    const rest = { ...data };
    for (const k of ["protocol", "version", "type"]) delete rest[k];
    const body = shape(spec.fields, [])(rest);
    return body ? { ok: true, message: data } : { ok: false, code: "bad-field", id };
  }

  // js/compute/origin.js
  var FRAME_ORIGIN = "https://gravitas-compute.github.io";
  var FRAME_URL = `${FRAME_ORIGIN}/`;
  var PARENT_ORIGINS = Object.freeze(["https://gravitas-sim.online"]);
  var LOOPBACK_PARENT = /^http:\/\/(127\.0\.0\.1|localhost|\[::1\])(:\d+)?$/;
  var parentAllowed = (origin) => PARENT_ORIGINS.includes(origin) || LOOPBACK_PARENT.test(origin);

  // js/compute/runtime.js
  var RUNTIME = Object.freeze({
    name: "pyodide",
    version: "314.0.7",
    python: "3.14.2",
    base: "https://cdn.jsdelivr.net/pyodide/v314.0.7/full/",
    lockSha256: "5dc2fc119108bc148c7457dc86e7675b5c87e1cafd420b9c34c1eaef7b36c010",
    /**
     * What the lock pins for each package a notebook may ask for, with each
     * one's wheels (itself and what it needs), as served: bytes, compressed.
     * numpy is one wheel; matplotlib's eleven wheels and numpy are the plot;
     * scipy is one wheel over numpy; astropy brings pyerfa, pyyaml, packaging
     * and the IERS tables (astropy-iers-data), five wheels over numpy.
     */
    packages: Object.freeze({
      numpy: Object.freeze({ version: "2.4.6" }),
      matplotlib: Object.freeze({ version: "3.10.8" }),
      scipy: Object.freeze({ version: "1.18.0" }),
      astropy: Object.freeze({ version: "7.2.0" })
    }),
    /** Download sizes as served (compressed), measured by the gate, rounded up. */
    bytes: Object.freeze({
      core: 598e4,
      numpy: 293e4,
      matplotlib: 994e4,
      scipy: 1383e4,
      astropy: 823e4
    })
  });
  var ALLOWED_PACKAGES = Object.freeze(Object.keys(RUNTIME.packages));

  // js/compute/frame/runner.js
  var BUILD = "e880d4ee23205b2816b61e8a63a9d7991b0665a500e71ac823b9d65d9316543b";
  var WORKER_SOURCE = '(() => {\n  // <define:__PIN__>\n  var define_PIN_default = { base: "https://cdn.jsdelivr.net/pyodide/v314.0.7/full/", version: "314.0.7", lockSha256: "5dc2fc119108bc148c7457dc86e7675b5c87e1cafd420b9c34c1eaef7b36c010" };\n\n  // js/compute/frame/worker.js\n  var PIN = define_PIN_default;\n  var py = null;\n  var lockSha256 = null;\n  var t0 = () => performance.now();\n  var Coded = class extends Error {\n    constructor(code, text) {\n      super(text);\n      this.code = code;\n    }\n  };\n  var post = (type, fields) => self.postMessage({\n    protocol: "gravitas-compute",\n    version: 1,\n    type,\n    ...fields\n  });\n  function classify(err) {\n    if (err instanceof Coded) return { code: err.code, text: err.message };\n    const text = String(err?.message ?? err);\n    if (err?.name === "RangeError" || /MemoryError|out of memory|could not allocate/i.test(text))\n      return { code: "memory", text: "the runtime ran out of memory" };\n    if (err?.name === "PythonError" || /Traceback/.test(text))\n      return {\n        code: "notebook-error",\n        text: text.split("\\n").filter(Boolean).slice(-4).join("\\n")\n      };\n    if (err instanceof TypeError || /fetch|network|load|import/i.test(text))\n      return { code: "runtime-download", text };\n    return { code: "notebook-error", text };\n  }\n  async function ensureRuntime(id, marks, lock) {\n    if (py) return;\n    post("progress", { id, phase: "runtime" });\n    lockSha256 = PIN.lockSha256;\n    try {\n      importScripts(`${PIN.base}pyodide.js`);\n      py = await loadPyodide({\n        indexURL: PIN.base,\n        packageBaseUrl: PIN.base,\n        lockFileContents: lock\n      });\n    } catch {\n      throw new Coded("runtime-download", "the runtime could not be downloaded");\n    }\n    if (py.version !== PIN.version)\n      throw new Coded(\n        "runtime-version",\n        `the runtime is ${py.version}, not ${PIN.version}`\n      );\n    marks.runtime = t0();\n  }\n  async function ensurePackages(id, packages, marks) {\n    post("progress", { id, phase: "packages" });\n    try {\n      await py.loadPackage(packages, { checkIntegrity: true });\n    } catch {\n      throw new Coded(\n        "runtime-download",\n        "a package could not be downloaded or did not match its hash"\n      );\n    }\n    marks.packages = t0();\n  }\n  function runtimeRecord(packages) {\n    const versions = {};\n    for (const k of packages)\n      versions[k] = py.runPython(\n        [\n          "import importlib.metadata as _m",\n          `_m.version(${JSON.stringify(k)})`\n        ].join("\\n")\n      ) ?? null;\n    return {\n      name: "pyodide",\n      version: py.version,\n      python: py.runPython("import sys; sys.version.split()[0]"),\n      lockSha256,\n      packages: versions\n    };\n  }\n  var heap = () => {\n    try {\n      return py._module.HEAP8.length;\n    } catch {\n      return 0;\n    }\n  };\n  var elapsed = (start, marks) => Object.fromEntries(\n    Object.entries(marks).map(([k, v]) => [\n      k,\n      Math.round(Math.max(0, v - start))\n    ])\n  );\n  self.onmessage = async ({ data: m }) => {\n    const start = t0();\n    const marks = {};\n    try {\n      await ensureRuntime(m.id, marks, m.lock);\n      await ensurePackages(m.id, m.packages, marks);\n      if (m.op === "load") {\n        post("loaded", {\n          id: m.id,\n          runtime: runtimeRecord(m.packages),\n          marks: elapsed(start, marks),\n          heapBytes: heap()\n        });\n        return;\n      }\n      post("progress", { id: m.id, phase: "cells" });\n      const stdout = [];\n      py.setStdout({ batched: (s) => stdout.length < 200 && stdout.push(s) });\n      py.setStderr({ batched: (s) => stdout.length < 200 && stdout.push(s) });\n      const ns = py.runPython("dict()");\n      let output;\n      try {\n        ns.set("gravitas_input", m.input);\n        ns.set("gravitas_params", m.params);\n        for (const cell of m.cells)\n          await py.runPythonAsync(cell, { globals: ns });\n        marks.cells = t0();\n        py.globals.set("_gravitas_ns", ns);\n        output = py.runPython(\n          [\n            "import json as _j",\n            \'_o = _gravitas_ns["gravitas_output"]\',\n            \'_j.dumps({k: _j.dumps(_o[k], sort_keys=True, separators=(",", ":"), allow_nan=False) for k in _o}, allow_nan=False)\'\n          ].join("\\n")\n        );\n      } finally {\n        try {\n          py.globals.delete("_gravitas_ns");\n        } catch {\n        }\n        ns.destroy();\n      }\n      if (output.length > 4e6)\n        throw new Coded(\n          "output-too-large",\n          "the answer is larger than an answer may be"\n        );\n      post("result", {\n        id: m.id,\n        output,\n        stdout: stdout.join("\\n").slice(0, 64e3),\n        heapBytes: heap(),\n        marks: elapsed(start, marks),\n        runtime: runtimeRecord(m.packages)\n      });\n    } catch (err) {\n      const { code, text } = classify(err);\n      post("error", { id: m.id, code, message: text.slice(0, 2e3) });\n    }\n  };\n})();\n';
  var port = null;
  var worker = null;
  var busy = null;
  var lock = null;
  var hex = (buf) => Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join(
    ""
  );
  async function ensureLock() {
    if (lock) return lock;
    let text;
    try {
      const r = await fetch(`${RUNTIME.base}pyodide-lock.json`, {
        cache: "no-store"
      });
      if (!r.ok) throw new Error(String(r.status));
      text = await r.text();
    } catch {
      const e = new Error("the runtime could not be downloaded");
      e.code = "runtime-download";
      throw e;
    }
    const digest = hex(
      await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text))
    );
    if (digest !== RUNTIME.lockSha256) {
      const e = new Error(
        "the runtime release is not the one Gravitas pins (its lock file differs)"
      );
      e.code = "runtime-version";
      throw e;
    }
    lock = text;
    return lock;
  }
  async function probes() {
    const r = {};
    const sync = (k, fn) => {
      try {
        fn();
        r[k] = "allowed";
      } catch (e) {
        r[k] = `refused (${e.name})`.slice(0, 80);
      }
    };
    sync("localStorage", () => window.localStorage.length);
    sync("sessionStorage", () => window.sessionStorage.length);
    sync("cookie", () => document.cookie);
    sync("parentDocument", () => window.parent.document.title);
    sync("topLocation", () => window.top.location.href);
    r.origin = String(self.origin).slice(0, 80);
    try {
      await new Promise((ok, bad) => {
        const q = indexedDB.open("probe");
        q.onsuccess = ok;
        q.onerror = () => bad(q.error);
      });
      r.indexedDB = "allowed";
    } catch (e) {
      r.indexedDB = `refused (${e?.name || e})`.slice(0, 80);
    }
    try {
      await caches.keys();
      r.caches = "allowed";
    } catch (e) {
      r.caches = `refused (${e?.name || e})`.slice(0, 80);
    }
    return r;
  }
  var send = (type, fields) => port.postMessage(message(type, fields));
  var fail = (id, code, text) => send("error", { id, code, message: String(text ?? code).slice(0, 2e3) });
  function startWorker() {
    worker = new Worker(
      URL.createObjectURL(new Blob([WORKER_SOURCE], { type: "text/javascript" }))
    );
    worker.onmessage = ({ data }) => {
      const m = readMessage(
        data && typeof data === "object" ? { ...data } : null,
        "frame"
      );
      if (!m.ok || m.message.type === "ready") return;
      if (m.message.type === "result" || m.message.type === "loaded" || m.message.type === "error")
        busy = null;
      port.postMessage(m.message);
    };
    worker.onerror = (e) => {
      const id = busy;
      busy = null;
      worker = null;
      fail(id, "runtime-download", e.message || "the worker failed");
    };
  }
  function onPage({ data }) {
    const m = readMessage(data, "page");
    if (!m.ok) return fail(m.id, "invalid-request", `refused: ${m.code}`);
    const { type, id } = m.message;
    if (type === "hello") return fail(null, "invalid-request", "already started");
    if (type === "cancel") {
      if (busy !== id) return;
      worker?.terminate();
      worker = null;
      busy = null;
      return fail(id, "cancelled", "stopped");
    }
    if (busy) return fail(id, "busy", "another request is still running");
    busy = id;
    if (!worker) startWorker();
    const job = { ...m.message, op: type };
    for (const k of ["protocol", "version", "type"]) delete job[k];
    ensureLock().then(
      (text) => worker?.postMessage({ ...job, lock: text }),
      (err) => {
        busy = null;
        fail(id, err.code ?? "runtime-download", err.message);
      }
    );
  }
  window.addEventListener("message", async (e) => {
    if (port || e.source !== window.parent || !parentAllowed(e.origin)) return;
    const m = readMessage(e.data, "page");
    if (!m.ok || m.message.type !== "hello" || e.ports.length !== 1) return;
    port = e.ports[0];
    port.onmessage = onPage;
    send("ready", { build: BUILD, probes: await probes() });
  });
})();
</script>
